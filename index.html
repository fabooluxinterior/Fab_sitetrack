<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Optimized for Mobile: Prevents unwanted zooming on iOS/Android when tapping text boxes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Site Track - Field Coordinator App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- HTML2PDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATABASE HOOK (Local Storage) ---
        const useDatabase = () => {
            const defaultUsers = [
                { id: '1', email: 'designer8fab@gmail.com', password: 'Fab999', role: 'admin', name: 'Admin Fab' }
            ];

            const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('siteLogs')) || []);
            const [activeSites, setActiveSites] = useState(() => JSON.parse(localStorage.getItem('activeSites')) || []);
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('siteUsers')) || defaultUsers);
            const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('currentUser')) || null);

            // Persist data whenever it changes
            useEffect(() => { localStorage.setItem('siteLogs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('activeSites', JSON.stringify(activeSites)); }, [activeSites]);
            useEffect(() => { localStorage.setItem('siteUsers', JSON.stringify(users)); }, [users]);
            useEffect(() => { 
                if (currentUser) {
                    localStorage.setItem('currentUser', JSON.stringify(currentUser)); 
                } else {
                    localStorage.removeItem('currentUser');
                }
            }, [currentUser]);

            return { logs, setLogs, activeSites, setActiveSites, users, setUsers, currentUser, setCurrentUser };
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const db = useDatabase();

            const handleLogout = () => {
                db.setCurrentUser(null);
                window.location.hash = ''; // Clear history hash on logout
            };

            if (!db.currentUser) {
                return <LoginScreen db={db} />;
            }

            return (
                <div class="max-w-md mx-auto sm:max-w-5xl bg-white min-h-screen shadow-lg flex flex-col">
                    <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow sticky top-0 z-10">
                        <h1 class="text-xl font-bold flex items-center"><i class="fa-solid fa-map-location-dot mr-2"></i>Site Track</h1>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-semibold truncate max-w-[120px] sm:max-w-xs">
                                {db.currentUser.role === 'admin' ? `Admin` : db.currentUser.name}
                            </span>
                            <button onClick={handleLogout} class="bg-blue-800 px-3 py-1 rounded text-sm hover:bg-blue-900 transition shadow">Logout</button>
                        </div>
                    </header>
                    <main class="p-4 flex-grow">
                        {db.currentUser.role === 'coordinator' && <CoordinatorApp db={db} />}
                        {db.currentUser.role === 'admin' && <AdminApp db={db} />}
                        {!['coordinator', 'admin'].includes(db.currentUser.role) && <p class="text-red-500">Error: Invalid user role.</p>}
                    </main>
                </div>
            );
        }

        // --- LOGIN SCREEN ---
        function LoginScreen({ db }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const user = db.users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
                if (user) {
                    window.location.hash = 'home'; // Reset hash for clean navigation
                    db.setCurrentUser(user);
                } else {
                    setError('Invalid email or password.');
                }
            };

            return (
                <div class="flex items-center justify-center min-h-screen bg-gray-200 p-4">
                    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-sm text-center">
                        <i class="fa-solid fa-map-location-dot text-5xl text-blue-600 mb-4"></i>
                        <h1 class="text-2xl font-bold mb-2">Site Track</h1>
                        <p class="text-gray-600 mb-6 text-sm">Please log in to continue</p>
                        
                        {error && <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-semibold">{error}</div>}

                        <form onSubmit={handleLogin} class="space-y-4 text-left">
                            <div>
                                <label class="block text-sm font-bold mb-1 text-gray-700">Email Address</label>
                                <input required type="email" class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@example.com" value={email} onChange={e => setEmail(e.target.value)} />
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1 text-gray-700">Password</label>
                                <input required type="password" class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} />
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow mt-2">
                                Log In
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- COORDINATOR APP (With Swipe-Back Support) ---
        function CoordinatorApp({ db }) {
            const currentUser = db.currentUser;
            const [view, setView] = useState(() => window.location.hash.replace('#', '') || 'home'); 
            const [selectedSite, setSelectedSite] = useState(null);

            // Listen for phone Back Gesture
            useEffect(() => {
                const handleHashChange = () => {
                    const currentHash = window.location.hash.replace('#', '') || 'home';
                    setView(currentHash);
                };
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const navigateTo = (newView) => { window.location.hash = newView; };
            const goBack = () => {
                if (window.location.hash && window.location.hash !== '#home') {
                    window.history.back();
                } else {
                    navigateTo('home');
                }
            };

            const myActiveSites = db.activeSites.filter(site => site.coordinatorId === currentUser.id);

            if (view === 'checkin') return <CheckInFlow db={db} currentUser={currentUser} goBack={goBack} />;
            if (view === 'checkout') return <CheckOutFlow db={db} siteToCheckout={selectedSite} goBack={goBack} />;

            return (
                <div class="space-y-6">
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 shadow-sm">
                        <h2 class="text-lg font-bold mb-3 text-blue-900">Actions</h2>
                        <button onClick={() => navigateTo('checkin')} class="w-full bg-green-600 text-white py-4 rounded-lg shadow-md hover:bg-green-700 flex items-center justify-center font-bold text-lg transition active:scale-95">
                            <i class="fa-solid fa-sign-in-alt mr-2 text-xl"></i> Log In to New Site
                        </button>
                    </div>

                    <div>
                        <h2 class="text-lg font-bold mb-3 border-b pb-2 text-gray-800">My Active Sites</h2>
                        {myActiveSites.length === 0 ? (
                            <div class="bg-gray-50 border rounded-lg p-8 text-center text-gray-500">
                                <i class="fa-solid fa-clipboard-check text-4xl mb-2 text-gray-300"></i>
                                <p>You are not checked into any sites.</p>
                            </div>
                        ) : (
                            <div class="space-y-3">
                                {myActiveSites.map(site => (
                                    <div key={site.id} class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                        <div>
                                            <h3 class="font-bold text-lg text-gray-800">{site.siteName}</h3>
                                            <p class="text-sm text-gray-500 mb-1"><i class="fa-solid fa-location-dot mr-1"></i> {site.locationDetails}</p>
                                            <p class="text-sm text-blue-600 font-semibold bg-blue-50 inline-block px-2 py-1 rounded"><i class="fa-regular fa-clock mr-1"></i> Checked in: {new Date(site.checkInTime).toLocaleTimeString()}</p>
                                        </div>
                                        <button 
                                            onClick={() => { setSelectedSite(site); navigateTo('checkout'); }}
                                            class="w-full sm:w-auto bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600 font-bold shadow transition active:scale-95"
                                        >
                                            Log Out <i class="fa-solid fa-sign-out-alt ml-1"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- CHECK-IN FLOW ---
        function CheckInFlow({ db, currentUser, goBack }) {
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({ siteName: '', locationDetails: '', workers: '' });
            const [photo, setPhoto] = useState(null);
            const [location, setLocation] = useState(null);

            const handleFinalSubmit = () => {
                const newSite = {
                    id: Date.now().toString(),
                    coordinatorId: currentUser.id,
                    coordinatorName: currentUser.name,
                    siteName: formData.siteName,
                    locationDetails: formData.locationDetails,
                    workers: formData.workers,
                    checkInTime: new Date().toISOString(),
                    checkInPhoto: photo,
                    checkInLocation: location
                };
                db.setActiveSites([...db.activeSites, newSite]);
                alert("Successfully checked in!");
                goBack();
            };

            if (step === 1) {
                return (
                    <div class="animate-fade-in">
                        <button onClick={goBack} class="mb-4 text-blue-600 font-semibold p-2 -ml-2 rounded hover:bg-blue-50"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">Site Details (Check-In)</h2>
                        <form onSubmit={(e) => { e.preventDefault(); setStep(2); }} class="space-y-4 bg-white p-4 rounded-lg shadow-sm border">
                            <div>
                                <label class="block font-bold text-gray-700 mb-1">Site Name</label>
                                <input required type="text" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-blue-500 focus:outline-none" placeholder="e.g., Downtown Plaza Phase 2" value={formData.siteName} onChange={e => setFormData({...formData, siteName: e.target.value})} />
                            </div>
                            <div>
                                <label class="block font-bold text-gray-700 mb-1">Site Location / Zone</label>
                                <input required type="text" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-blue-500 focus:outline-none" placeholder="e.g., Sector 4" value={formData.locationDetails} onChange={e => setFormData({...formData, locationDetails: e.target.value})} />
                            </div>
                            <div>
                                <label class="block font-bold text-gray-700 mb-1">Total Workers Present</label>
                                <input required type="number" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-blue-500 focus:outline-none" placeholder="0" value={formData.workers} onChange={e => setFormData({...formData, workers: e.target.value})} />
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg mt-6 font-bold text-lg shadow hover:bg-blue-700">Continue to Photo <i class="fa-solid fa-arrow-right ml-1"></i></button>
                        </form>
                    </div>
                );
            }

            return (
                <div class="animate-fade-in">
                    <button onClick={() => setStep(1)} class="mb-4 text-blue-600 font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
                    <h2 class="text-xl font-bold mb-4 text-gray-800">Verify Identity & Location</h2>
                    <p class="text-sm text-gray-600 mb-4">Please take a clear selfie at the site. We will also capture your GPS location.</p>
                    <CameraAndLocation onCapture={(img, loc) => { setPhoto(img); setLocation(loc); }} />
                    {photo && location && (
                        <button onClick={handleFinalSubmit} class="w-full bg-green-600 text-white py-4 rounded-lg mt-6 font-bold text-xl hover:bg-green-700 shadow-lg active:scale-95 transition">
                            Complete Check-In
                        </button>
                    )}
                </div>
            );
        }

        // --- CHECK-OUT FLOW ---
        function CheckOutFlow({ db, siteToCheckout, goBack }) {
            const [notes, setNotes] = useState('');
            const [photo, setPhoto] = useState(null);
            const [location, setLocation] = useState(null);

            // Failsafe if site was removed
            if (!siteToCheckout) { goBack(); return null; }

            const handleFinalSubmit = () => {
                const logEntry = {
                    ...siteToCheckout,
                    checkOutTime: new Date().toISOString(),
                    checkOutPhoto: photo,
                    checkOutLocation: location,
                    notes: notes
                };
                db.setLogs([...db.logs, logEntry]);
                db.setActiveSites(db.activeSites.filter(s => s.id !== siteToCheckout.id));
                alert("Successfully logged out of site!");
                goBack();
            };

            return (
                <div class="animate-fade-in">
                    <button onClick={goBack} class="mb-4 text-blue-600 font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Cancel</button>
                    <h2 class="text-2xl font-bold mb-4 text-gray-800">Check-Out: {siteToCheckout.siteName}</h2>
                    
                    <div class="mb-6 bg-white p-4 border rounded-lg shadow-sm">
                        <label class="block font-bold text-gray-700 mb-2">Closing Remarks / Notes (Optional)</label>
                        <textarea class="w-full border-2 border-gray-200 p-3 rounded-lg h-28 focus:border-blue-500 focus:outline-none" placeholder="Enter any issues, progress notes, or material requests..." value={notes} onChange={e => setNotes(e.target.value)}></textarea>
                    </div>

                    <h3 class="font-bold mb-2 text-gray-800">Checkout Verification</h3>
                    <CameraAndLocation onCapture={(img, loc) => { setPhoto(img); setLocation(loc); }} />
                    
                    {photo && location && (
                        <button onClick={handleFinalSubmit} class="w-full bg-red-600 text-white py-4 rounded-lg mt-6 font-bold text-xl hover:bg-red-700 shadow-lg active:scale-95 transition">
                            Confirm Check-Out
                        </button>
                    )}
                </div>
            );
        }

        // --- CAMERA & LOCATION HELPER ---
        function CameraAndLocation({ onCapture }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [stream, setStream] = useState(null);
            const [capturedImg, setCapturedImg] = useState(null);
            const [geo, setGeo] = useState(null);
            const [loadingGeo, setLoadingGeo] = useState(false);
            const [cameraError, setCameraError] = useState('');

            useEffect(() => { startCamera(); return () => stopCamera(); }, []);

            const startCamera = async () => {
                try {
                    setCameraError('');
                    const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    setStream(mediaStream);
                    if (videoRef.current) videoRef.current.srcObject = mediaStream;
                } catch (err) { 
                    setCameraError("Camera access denied or unavailable. Please check browser permissions.");
                }
            };

            const stopCamera = () => { if (stream) stream.getTracks().forEach(track => track.stop()); };

            const captureData = () => {
                const canvas = canvasRef.current;
                const video = videoRef.current;
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imgData = canvas.toDataURL('image/jpeg', 0.6); 
                setCapturedImg(imgData);
                stopCamera();

                setLoadingGeo(true);
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const loc = { lat: position.coords.latitude, lng: position.coords.longitude };
                            setGeo(loc); setLoadingGeo(false); onCapture(imgData, loc);
                        },
                        (error) => {
                            alert("Location access denied. Using fallback location (0,0) for demo purposes.");
                            const fallback = { lat: 0, lng: 0 };
                            setGeo(fallback); setLoadingGeo(false); onCapture(imgData, fallback);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else { setLoadingGeo(false); }
            };

            const retake = () => { setCapturedImg(null); setGeo(null); onCapture(null, null); startCamera(); };

            if (cameraError) {
                return <div class="bg-red-50 text-red-700 p-4 rounded border border-red-200"><i class="fa-solid fa-triangle-exclamation mr-2"></i>{cameraError}</div>;
            }

            if (capturedImg) {
                return (
                    <div class="bg-gray-50 p-4 border-2 border-gray-200 rounded-lg shadow-inner">
                        <img src={capturedImg} class="w-full rounded-lg mb-3 shadow" alt="Selfie" />
                        {loadingGeo ? <p class="text-sm font-bold text-blue-600 flex items-center bg-blue-100 p-3 rounded"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Fetching precise GPS coordinates...</p> : 
                            <p class="text-sm font-bold text-green-800 bg-green-100 p-3 rounded border border-green-200"><i class="fa-solid fa-location-dot mr-2"></i> Lat: {geo?.lat.toFixed(5)}, Lng: {geo?.lng.toFixed(5)}</p>
                        }
                        <button onClick={retake} class="mt-4 w-full text-center font-bold text-blue-600 hover:text-blue-800 p-2 bg-white rounded border">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Retake Photo
                        </button>
                    </div>
                );
            }

            return (
                <div class="bg-black rounded-lg overflow-hidden relative shadow-lg border-2 border-gray-800">
                    {/* playsInline and muted are critical for iOS Safari video support */}
                    <video ref={videoRef} autoPlay playsInline muted class="w-full h-72 sm:h-96 object-cover"></video>
                    <canvas ref={canvasRef} class="hidden"></canvas>
                    <button onClick={captureData} class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white text-blue-600 p-4 rounded-full shadow-2xl hover:bg-gray-100 border-4 border-gray-300 active:scale-90 transition">
                        <i class="fa-solid fa-camera text-3xl"></i>
                    </button>
                </div>
            );
        }

        // --- ADMIN DASHBOARD ---
        function AdminApp({ db }) {
            const [tab, setTab] = useState('logs'); 
            
            return (
                <div>
                    <div class="flex overflow-x-auto border-b-2 mb-6 hide-scrollbar">
                        <button onClick={() => setTab('logs')} class={`px-4 py-3 font-bold whitespace-nowrap transition-colors ${tab === 'logs' ? 'text-blue-600 border-b-4 border-blue-600' : 'text-gray-500 hover:text-gray-700'}`}><i class="fa-solid fa-table-list mr-1"></i> Site Visits Data</button>
                        <button onClick={() => setTab('users')} class={`px-4 py-3 font-bold whitespace-nowrap transition-colors ${tab === 'users' ? 'text-blue-600 border-b-4 border-blue-600' : 'text-gray-500 hover:text-gray-700'}`}><i class="fa-solid fa-users-gear mr-1"></i> User Management</button>
                    </div>
                    {tab === 'logs' ? <LogsView db={db} /> : <UserManagementView db={db} />}
                </div>
            );
        }

        function LogsView({ db }) {
            const [filterName, setFilterName] = useState('');
            const [filterDate, setFilterDate] = useState('');
            const [selectedLog, setSelectedLog] = useState(null);

            const filteredLogs = db.logs.filter(log => {
                const matchName = log.coordinatorName.toLowerCase().includes(filterName.toLowerCase());
                const logDate = new Date(log.checkInTime).toISOString().split('T')[0];
                const matchDate = filterDate ? logDate === filterDate : true;
                return matchName && matchDate;
            }).sort((a, b) => new Date(b.checkInTime) - new Date(a.checkInTime)); // Sort newest first

            const downloadPDF = () => {
                const element = document.getElementById('pdf-report-content');
                const opt = {
                    margin: 0.5,
                    filename: `${selectedLog.coordinatorName}_SiteVisit_${new Date(selectedLog.checkInTime).toISOString().split('T')[0]}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            return (
                <div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
                        <h3 class="text-sm font-bold text-gray-500 mb-2 uppercase">Filter Records</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" placeholder="Coordinator Name..." class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" value={filterName} onChange={(e) => setFilterName(e.target.value)} />
                            <input type="date" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" value={filterDate} onChange={(e) => setFilterDate(e.target.value)} />
                        </div>
                    </div>

                    <div class="overflow-x-auto bg-white rounded-lg shadow border">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr class="bg-gray-800 text-white text-sm">
                                    <th class="p-4">Date</th>
                                    <th class="p-4">Coordinator</th>
                                    <th class="p-4">Site</th>
                                    <th class="p-4">Workers</th>
                                    <th class="p-4 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredLogs.length === 0 && (
                                    <tr><td colSpan="5" class="p-8 text-center text-gray-500"><i class="fa-solid fa-folder-open text-3xl mb-2 text-gray-300 block"></i>No records found matching filters.</td></tr>
                                )}
                                {filteredLogs.map(log => (
                                    <tr key={log.id} class="border-b hover:bg-blue-50 transition">
                                        <td class="p-4 text-sm">{new Date(log.checkInTime).toLocaleDateString()}</td>
                                        <td class="p-4 font-semibold">{log.coordinatorName}</td>
                                        <td class="p-4">{log.siteName}</td>
                                        <td class="p-4 text-center">{log.workers}</td>
                                        <td class="p-4 text-center">
                                            <button onClick={() => setSelectedLog(log)} class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-bold hover:bg-blue-200">View <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {selectedLog && (
                        <div class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-2 sm:p-4 z-50">
                            <div class="bg-white rounded-xl w-full max-w-4xl max-h-[98vh] flex flex-col shadow-2xl">
                                {/* Modal Header */}
                                <div class="flex justify-between items-center p-4 border-b bg-gray-50 rounded-t-xl">
                                    <h3 class="text-xl font-bold text-gray-800">Visit Details</h3>
                                    <div class="flex gap-2">
                                        <button onClick={downloadPDF} class="bg-green-600 text-white px-3 py-2 rounded font-bold hover:bg-green-700 text-sm shadow">
                                            <i class="fa-solid fa-file-pdf mr-1"></i> <span class="hidden sm:inline">Save PDF</span>
                                        </button>
                                        <button onClick={() => setSelectedLog(null)} class="bg-gray-300 text-gray-800 px-3 py-2 rounded font-bold hover:bg-gray-400 text-sm"><i class="fa-solid fa-times"></i></button>
                                    </div>
                                </div>
                                
                                {/* Modal Body (Target for PDF) */}
                                <div id="pdf-report-content" class="p-4 sm:p-8 overflow-y-auto bg-white rounded-b-xl">
                                    <h2 class="text-2xl font-black mb-1 text-blue-900">Site Track Report</h2>
                                    <p class="text-gray-500 mb-6 pb-4 border-b">Generated on {new Date().toLocaleString()}</p>
                                    
                                    <div class="grid grid-cols-2 gap-4 mb-6 bg-gray-50 p-4 rounded border border-gray-200">
                                        <div><p class="text-xs font-bold text-gray-400 uppercase">Coordinator</p><p class="font-bold text-lg text-gray-800">{selectedLog.coordinatorName}</p></div>
                                        <div><p class="text-xs font-bold text-gray-400 uppercase">Site Name</p><p class="font-bold text-lg text-gray-800">{selectedLog.siteName}</p></div>
                                        <div><p class="text-xs font-bold text-gray-400 uppercase">Location</p><p class="text-gray-700">{selectedLog.locationDetails}</p></div>
                                        <div><p class="text-xs font-bold text-gray-400 uppercase">Total Workers</p><p class="text-gray-700">{selectedLog.workers}</p></div>
                                    </div>

                                    <div class="grid sm:grid-cols-2 gap-6">
                                        <div class="p-4 rounded border-2 border-green-100 bg-green-50/30">
                                            <h4 class="font-black text-green-700 mb-2 pb-1 border-b border-green-200 uppercase text-sm"><i class="fa-solid fa-arrow-right-to-bracket mr-1"></i> Check-In</h4>
                                            <p class="text-sm font-semibold mb-3 text-gray-800"><i class="fa-regular fa-clock mr-1 text-gray-500"></i> {new Date(selectedLog.checkInTime).toLocaleString()}</p>
                                            <img src={selectedLog.checkInPhoto} class="w-full h-48 sm:h-64 object-cover rounded mb-3 border shadow-sm" />
                                            <div class="bg-white p-2 rounded border text-xs text-gray-600 mb-2 font-mono">Lat: {selectedLog.checkInLocation?.lat.toFixed(6)}<br/>Lng: {selectedLog.checkInLocation?.lng.toFixed(6)}</div>
                                            <a href={`https://www.google.com/maps?q=${selectedLog.checkInLocation?.lat},${selectedLog.checkInLocation?.lng}`} target="_blank" class="text-sm text-blue-600 hover:underline font-bold inline-block">
                                                <i class="fa-solid fa-map-marker-alt mr-1"></i> Open in Maps
                                            </a>
                                        </div>
                                        
                                        <div class="p-4 rounded border-2 border-red-100 bg-red-50/30">
                                            <h4 class="font-black text-red-700 mb-2 pb-1 border-b border-red-200 uppercase text-sm"><i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Check-Out</h4>
                                            <p class="text-sm font-semibold mb-3 text-gray-800"><i class="fa-regular fa-clock mr-1 text-gray-500"></i> {new Date(selectedLog.checkOutTime).toLocaleString()}</p>
                                            <img src={selectedLog.checkOutPhoto} class="w-full h-48 sm:h-64 object-cover rounded mb-3 border shadow-sm" />
                                            <div class="bg-white p-2 rounded border text-xs text-gray-600 mb-2 font-mono">Lat: {selectedLog.checkOutLocation?.lat.toFixed(6)}<br/>Lng: {selectedLog.checkOutLocation?.lng.toFixed(6)}</div>
                                            <a href={`https://www.google.com/maps?q=${selectedLog.checkOutLocation?.lat},${selectedLog.checkOutLocation?.lng}`} target="_blank" class="text-sm text-blue-600 hover:underline font-bold inline-block">
                                                <i class="fa-solid fa-map-marker-alt mr-1"></i> Open in Maps
                                            </a>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-6 bg-yellow-50 border border-yellow-200 p-4 rounded">
                                        <p class="text-sm font-bold text-yellow-800 mb-2 uppercase"><i class="fa-solid fa-note-sticky mr-1"></i> Closing Remarks:</p>
                                        <p class="text-gray-800 whitespace-pre-wrap">{selectedLog.notes || 'No notes provided.'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UserManagementView({ db }) {
            const [newUser, setNewUser] = useState({ name: '', email: '', password: '', role: 'coordinator' });

            const handleAddUser = (e) => {
                e.preventDefault();
                if(db.users.find(u => u.email.toLowerCase() === newUser.email.toLowerCase())) {
                    alert("A user with this email already exists!");
                    return;
                }
                const userObj = { ...newUser, id: Date.now().toString() };
                db.setUsers([...db.users, userObj]);
                setNewUser({ name: '', email: '', password: '', role: 'coordinator' });
                alert("User added successfully!");
            };

            const removeUser = (id) => {
                if(id === '1') { alert("Cannot delete the primary admin account."); return; }
                if(confirm("Are you sure you want to remove this user?")) {
                    db.setUsers(db.users.filter(u => u.id !== id));
                }
            };

            return (
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 bg-white p-5 rounded-lg shadow border h-fit">
                        <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2">Add New User</h3>
                        <form onSubmit={handleAddUser} class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Full Name</label>
                                <input required type="text" class="w-full border-2 border-gray-200 p-2 rounded focus:border-blue-500 outline-none text-sm" value={newUser.name} onChange={e=>setNewUser({...newUser, name: e.target.value})} />
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                                <input required type="email" class="w-full border-2 border-gray-200 p-2 rounded focus:border-blue-500 outline-none text-sm" value={newUser.email} onChange={e=>setNewUser({...newUser, email: e.target.value})} />
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                                <input required type="text" class="w-full border-2 border-gray-200 p-2 rounded focus:border-blue-500 outline-none text-sm" value={newUser.password} onChange={e=>setNewUser({...newUser, password: e.target.value})} />
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Role</label>
                                <select class="w-full border-2 border-gray-200 p-2 rounded focus:border-blue-500 outline-none text-sm bg-white" value={newUser.role} onChange={e=>setNewUser({...newUser, role: e.target.value})}>
                                    <option value="coordinator">Field Coordinator</option>
                                    <option value="admin">System Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700 shadow mt-2">Create User</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-lg shadow border overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="p-4 text-sm text-gray-700">Name</th>
                                    <th class="p-4 text-sm text-gray-700">Email</th>
                                    <th class="p-4 text-sm text-gray-700 text-center">Role</th>
                                    <th class="p-4 text-sm text-gray-700 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {db.users.map(user => (
                                    <tr key={user.id} class="border-t hover:bg-gray-50">
                                        <td class="p-4 font-bold text-gray-800">{user.name}</td>
                                        <td class="p-4 text-sm text-gray-600">{user.email}</td>
                                        <td class="p-4 text-center">
                                            <span class={`px-3 py-1 rounded-full text-xs font-bold ${user.role === 'admin' ? 'bg-purple-100 text-purple-800 border border-purple-200' : 'bg-green-100 text-green-800 border border-green-200'}`}>
                                                {user.role.toUpperCase()}
                                            </span>
                                        </td>
                                        <td class="p-4 text-center">
                                            {user.id !== '1' ? (
                                                <button onClick={() => removeUser(user.id)} class="text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-1 rounded text-sm font-bold transition"><i class="fa-solid fa-trash mr-1"></i> Remove</button>
                                            ) : (
                                                <span class="text-xs text-gray-400 italic">Primary Admin</span>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        /* Custom scrollbar hiding for horizontal tabs */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Smooth fade-in animation for views */
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
