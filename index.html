<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Site Track - Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        primaryHover: '#4338ca',
                        bgLight: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .modern-input { padding-left: 2.75rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; transition: all 0.2s; }
        .modern-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); outline: none; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ------------------------------------------------------------
        // ACTIVE GOOGLE APPS SCRIPT WEB APP URL
        // ------------------------------------------------------------
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxMkaU5psRL8KChj8Syx5KisE16IcezXRiwm4HTDq5RVRqCaoB0IUzbmd3DvFZ-9Afc/exec";

        const DEFAULT_USERS = [
            { id: '1', email: 'designer8fab@gmail.com', password: 'Fab999', role: 'admin', name: 'Admin Fab' }
        ];

        const useDatabase = () => {
            const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('st_logs') || '[]'));
            const [activeSites, setActiveSites] = useState(() => JSON.parse(localStorage.getItem('st_active') || '[]'));
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('st_users')) || DEFAULT_USERS);
            const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('st_cur_user')) || null);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => { localStorage.setItem('st_logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('st_active', JSON.stringify(activeSites)); }, [activeSites]);
            useEffect(() => { localStorage.setItem('st_users', JSON.stringify(users)); }, [users]);
            useEffect(() => { 
                if (currentUser) localStorage.setItem('st_cur_user', JSON.stringify(currentUser));
                else localStorage.removeItem('st_cur_user'); 
            }, [currentUser]);

            const syncFromGoogleSheet = async (silent = false) => {
                if (!GOOGLE_SHEET_API_URL || GOOGLE_SHEET_API_URL.includes("YOUR_GOOGLE_APPS")) return;
                try {
                    if (!silent) setIsSyncing(true);
                    const res = await fetch(GOOGLE_SHEET_API_URL);
                    const data = await res.json();
                    if (data.users && data.users.length > 0) {
                        const mergedUsers = [...DEFAULT_USERS];
                        data.users.forEach(u => {
                            if (!mergedUsers.some(mu => mu.email.toLowerCase() === u.email.toLowerCase())) mergedUsers.push(u);
                        });
                        setUsers(mergedUsers);
                    }
                    if (data.visits) {
                        const completed = data.visits.filter(v => v.checkOutTime);
                        const active = data.visits.filter(v => !v.checkOutTime);
                        setLogs(completed);
                        setActiveSites(active);
                    }
                } catch(err) { console.log("Offline mode or sync delay"); } 
                finally { if (!silent) setIsSyncing(false); }
            };

            const pushToGoogleSheet = (action, payload) => {
                if (!GOOGLE_SHEET_API_URL || GOOGLE_SHEET_API_URL.includes("YOUR_GOOGLE_APPS")) return;
                fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action, data: payload.data, id: payload.id })
                }).catch(e => console.error("Sheet push queued:", e));
            };

            useEffect(() => { 
                syncFromGoogleSheet(false);
                const interval = setInterval(() => syncFromGoogleSheet(true), 3000); 
                const onFocus = () => syncFromGoogleSheet(true); 
                window.addEventListener('focus', onFocus);
                return () => { clearInterval(interval); window.removeEventListener('focus', onFocus); };
            }, []);

            return { logs, setLogs, activeSites, setActiveSites, users, setUsers, currentUser, setCurrentUser, pushToGoogleSheet, syncFromGoogleSheet, isSyncing };
        };

        function ToastNotification({ toast, onClose }) {
            useEffect(() => {
                if (toast) { const timer = setTimeout(onClose, 3500); return () => clearTimeout(timer); }
            }, [toast]);

            if (!toast) return null;

            const styles = { success: 'bg-emerald-600 border-emerald-700', error: 'bg-red-600 border-red-700', warning: 'bg-amber-500 border-amber-600' };
            const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', warning: 'fa-triangle-exclamation' };

            return (
                <div class={`fixed top-4 left-1/2 w-[90%] max-w-sm z-[999] animate-slide-down text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border ${styles[toast.type]}`}>
                    <i class={`fa-solid ${icons[toast.type]} text-xl`}></i>
                    <span class="font-bold text-sm leading-tight flex-1">{toast.message}</span>
                    <button onClick={onClose} class="text-white/70 hover:text-white"><i class="fa-solid fa-times"></i></button>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null }; }
            static getDerivedStateFromError(error) { return { error: error.toString() }; }
            render() {
                if (this.state.error) {
                    return (
                        <div class="p-6 bg-red-50 text-red-700 min-h-screen">
                            <h2 class="text-xl font-bold mb-2">Display Error Detected</h2>
                            <p class="font-mono text-sm mb-4 break-words">{this.state.error}</p>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} class="bg-red-600 text-white px-4 py-2 rounded font-bold">Reset Storage</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const db = useDatabase();
            const [toast, setToast] = useState(null);
            const showToast = (message, type = 'success') => setToast({ message, type });

            return (
                <>
                    <ToastNotification toast={toast} onClose={() => setToast(null)} />
                    {!db.currentUser ? <LoginScreen db={db} showToast={showToast} /> :
                     db.currentUser.role === 'admin' ? <AdminLayout db={db} showToast={showToast} /> :
                     <CoordinatorApp db={db} showToast={showToast} />}
                </>
            );
        }

        function LoginScreen({ db, showToast }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanEmail = email.trim().toLowerCase();
                const user = db.users.find(u => u.email.toLowerCase() === cleanEmail && String(u.password) === String(password));
                if (user) {
                    window.location.hash = 'dashboard';
                    db.setCurrentUser(user);
                    showToast(`Welcome back, ${user.name}!`, "success");
                } else { showToast("Invalid email or password.", "error"); }
            };

            return (
                <div class="flex flex-col items-center justify-center min-h-screen p-4">
                    <div class="mb-8 text-center">
                        <div class="bg-primary text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-primary/30">
                            <i class="fa-solid fa-location-dot text-3xl"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Site Track</h1>
                        <p class="text-slate-500 font-medium">Field Operations Access</p>
                    </div>

                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 w-full max-w-md animate-fade-in">
                        <form onSubmit={handleLogin} class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold mb-2 text-slate-700">Email Address</label>
                                <div class="relative">
                                    <i class="fa-regular fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                    <input required type="email" class="w-full py-3 modern-input bg-slate-50/50" placeholder="coordinator@sitetrack.com" value={email} onChange={e => setEmail(e.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2 text-slate-700">Password</label>
                                <div class="relative">
                                    <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                    <input required type="password" class="w-full py-3 modern-input bg-slate-50/50" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} />
                                </div>
                            </div>
                            
                            <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-lg hover:bg-primaryHover transition shadow-lg shadow-primary/25 mt-4">
                                Sign In
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function CoordinatorApp({ db, showToast }) {
            const currentUser = db.currentUser;
            const [view, setView] = useState(() => window.location.hash.replace('#', '') || 'home'); 
            const [selectedSite, setSelectedSite] = useState(null);

            useEffect(() => {
                const handleHashChange = () => setView(window.location.hash.replace('#', '') || 'home');
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const navigateTo = (newView) => { window.location.hash = newView; };
            const goBack = () => { window.location.hash && window.location.hash !== '#home' ? window.history.back() : navigateTo('home'); };
            const handleLogout = () => { db.setCurrentUser(null); window.location.hash = ''; };

            if (view === 'checkin') return <CheckInFlow db={db} currentUser={currentUser} goBack={goBack} showToast={showToast} />;
            if (view === 'checkout') return <CheckOutFlow db={db} siteToCheckout={selectedSite} goBack={goBack} showToast={showToast} />;

            const myActiveSites = db.activeSites.filter(site => String(site.coordinatorId) === String(currentUser.id));

            return (
                <div class="max-w-md mx-auto bg-bgLight min-h-screen flex flex-col">
                    <header class="bg-white p-5 flex justify-between items-center border-b border-slate-100 sticky top-0 z-10">
                        <div class="flex items-center gap-3">
                            <div class="bg-primary text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-md shadow-primary/20">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div>
                                <h1 class="font-extrabold text-slate-900 leading-tight">Site Track</h1>
                                <p class="text-xs text-slate-500 font-medium truncate max-w-[150px]">{currentUser.name}</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} class="text-slate-400 hover:text-slate-700 bg-slate-50 p-2.5 rounded-xl border border-slate-100 transition shadow-sm" title="Log Out">
                            <i class="fa-solid fa-sign-out-alt"></i>
                        </button>
                    </header>
                    
                    <main class="p-5 flex-grow space-y-6">
                        <button onClick={() => navigateTo('checkin')} class="w-full bg-primary text-white py-4 rounded-2xl shadow-lg shadow-primary/25 hover:bg-primaryHover flex items-center justify-center font-bold text-lg transition active:scale-95">
                            New Site Visit <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>

                        <div>
                            <h2 class="text-sm font-extrabold text-slate-400 uppercase tracking-wider mb-4 pl-1">Active Locations</h2>
                            {myActiveSites.length === 0 ? (
                                <div class="bg-white border border-slate-100 rounded-2xl p-8 text-center shadow-sm">
                                    <div class="bg-slate-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <i class="fa-solid fa-clipboard-check text-2xl text-slate-300"></i>
                                    </div>
                                    <p class="text-slate-500 font-medium">No active check-ins.</p>
                                </div>
                            ) : (
                                <div class="space-y-4">
                                    {myActiveSites.map(site => (
                                        <div key={site.id} class="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                            <div class="flex justify-between items-start mb-4">
                                                <div>
                                                    <h3 class="font-extrabold text-lg text-slate-900">{site.siteName}</h3>
                                                    <p class="text-sm text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i> {site.locationDetails}</p>
                                                </div>
                                                <span class="bg-green-50 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md border border-green-100">On-site</span>
                                            </div>
                                            <div class="flex items-center justify-between border-t border-slate-50 pt-4">
                                                <p class="text-xs text-slate-500 font-medium"><i class="fa-regular fa-clock mr-1"></i> In: {new Date(site.checkInTime).toLocaleTimeString('en-US',{hour: '2-digit', minute:'2-digit'})}</p>
                                                <button onClick={() => { setSelectedSite(site); navigateTo('checkout'); }} class="text-primary font-bold text-sm bg-indigo-50 px-4 py-2 rounded-lg hover:bg-indigo-100 transition">
                                                    Check Out
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        function CheckInFlow({ db, currentUser, goBack, showToast }) {
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({ siteName: 'PJ-', locationDetails: '', workers: '' });
            const [photo, setPhoto] = useState(null);
            const [location, setLocation] = useState(null);
            const [showSuggestions, setShowSuggestions] = useState(false);

            const recentUniqueSites = useMemo(() => {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - 15);
                
                const allVisits = [...db.logs, ...db.activeSites]
                    .filter(v => String(v.coordinatorId) === String(currentUser.id) && new Date(v.checkInTime) >= cutoff)
                    .sort((a, b) => new Date(b.checkInTime) - new Date(a.checkInTime));
                
                const unique = [];
                const seen = new Set();
                for (const v of allVisits) {
                    const nameLower = (v.siteName || "").toLowerCase().trim();
                    if (!seen.has(nameLower) && nameLower !== "") {
                        seen.add(nameLower);
                        unique.push({ siteName: v.siteName, locationDetails: v.locationDetails });
                    }
                }
                return unique;
            }, [db.logs, db.activeSites, currentUser.id]);

            const filteredSites = recentUniqueSites.filter(s => s.siteName.toLowerCase().includes(formData.siteName.toLowerCase()));

            const handleSiteNameChange = (e) => {
                let val = e.target.value.toUpperCase();
                if (!val.startsWith('PJ-')) {
                    val = 'PJ-' + val.replace(/^P?J?-?/i, '');
                }
                setFormData({...formData, siteName: val});
                setShowSuggestions(true);
            };

            const handleFinalSubmit = () => {
                const newSite = {
                    id: Date.now().toString(), coordinatorId: currentUser.id, coordinatorName: currentUser.name,
                    siteName: formData.siteName, locationDetails: formData.locationDetails, workers: formData.workers,
                    checkInTime: new Date().toISOString(), checkInPhoto: photo, checkInLocation: location
                };
                db.setActiveSites(prev => [...prev, newSite]);
                db.pushToGoogleSheet("syncVisit", { data: newSite });
                showToast("Site Check-In Complete!", "success");
                goBack();
            };

            return (
                <div class="max-w-md mx-auto bg-white min-h-screen animate-fade-in flex flex-col">
                    <header class="flex items-center p-4 border-b border-slate-100 sticky top-0 bg-white z-10">
                        <button onClick={step === 1 ? goBack : () => setStep(1)} class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-slate-800 hover:bg-slate-50 rounded-full transition"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                        <h1 class="flex-grow text-center font-extrabold text-lg text-slate-900 pr-10">New Site Visit</h1>
                    </header>

                    <div class="px-6 flex-grow pt-4">
                        {step === 1 ? (
                            <form onSubmit={(e) => { e.preventDefault(); setStep(2); }} class="space-y-6">
                                <div><h2 class="text-2xl font-extrabold text-slate-900 mb-1">Site Details</h2></div>
                                
                                <div class="relative">
                                    <label class="block text-sm font-bold mb-2 text-slate-700">Site Name</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-clipboard-list absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                        <input required type="text" 
                                            class="w-full py-3 pl-10 pr-4 border border-slate-200 rounded-xl focus:border-primary outline-none transition uppercase" 
                                            value={formData.siteName} 
                                            onChange={handleSiteNameChange}
                                            onFocus={() => setShowSuggestions(true)}
                                            onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                            placeholder="PJ-001 PROJECT NAME"
                                            autoComplete="off"
                                        />
                                    </div>
                                    
                                    {showSuggestions && filteredSites.length > 0 && (
                                        <div class="absolute z-20 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-56 overflow-y-auto">
                                            <div class="px-3 py-2 bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-500 uppercase sticky top-0 z-10 tracking-wider flex justify-between">
                                                <span>Recent Sites (Last 15 Days)</span>
                                            </div>
                                            {filteredSites.map((site, idx) => (
                                                <div key={idx} 
                                                    onClick={(e) => { 
                                                        e.preventDefault(); 
                                                        setFormData({...formData, siteName: site.siteName, locationDetails: site.locationDetails}); 
                                                        setShowSuggestions(false); 
                                                    }}
                                                    class="px-4 py-3 hover:bg-indigo-50 cursor-pointer border-b border-slate-50 last:border-0 transition"
                                                >
                                                    <p class="font-bold text-slate-800 text-sm">{site.siteName}</p>
                                                    <p class="text-xs text-slate-500 truncate">{site.locationDetails}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label class="block text-sm font-bold mb-2 text-slate-700">Location / Zone</label>
                                    <input required type="text" class="w-full py-3 px-4 border border-slate-200 rounded-xl focus:border-primary outline-none transition" value={formData.locationDetails} onChange={e => setFormData({...formData, locationDetails: e.target.value})} />
                                </div>
                                <div>
                                    <label class="block text-sm font-bold mb-2 text-slate-700">Workers Present</label>
                                    <input required type="number" class="w-full py-3 px-4 border border-slate-200 rounded-xl focus:border-primary outline-none transition" value={formData.workers} onChange={e => setFormData({...formData, workers: e.target.value})} />
                                </div>
                                <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-primaryHover transition">Next: Verify GPS & Photo</button>
                            </form>
                        ) : (
                            <div class="pb-8">
                                <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Verify Identity</h2>
                                <CameraAndLocation onCapture={(img, loc) => { setPhoto(img); setLocation(loc); }} showToast={showToast} />
                                {photo && location && (
                                    <button onClick={handleFinalSubmit} class="w-full bg-primary text-white py-4 rounded-xl mt-6 font-bold text-lg hover:bg-primaryHover shadow-lg transition">Confirm & Check In</button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function CheckOutFlow({ db, siteToCheckout, goBack, showToast }) {
            const [notes, setNotes] = useState('');
            const [photo, setPhoto] = useState(null);
            const [location, setLocation] = useState(null);

            if (!siteToCheckout) { goBack(); return null; }

            const handleFinalSubmit = () => {
                const logEntry = { ...siteToCheckout, checkOutTime: new Date().toISOString(), checkOutPhoto: photo, checkOutLocation: location, notes: notes };
                db.setLogs(prev => [...prev, logEntry]);
                db.setActiveSites(prev => prev.filter(s => s.id !== siteToCheckout.id));
                db.pushToGoogleSheet("syncVisit", { data: logEntry });
                showToast("Check-Out Complete!", "success");
                goBack();
            };

            return (
                <div class="max-w-md mx-auto bg-white min-h-screen animate-fade-in flex flex-col">
                    <header class="flex items-center p-4 border-b border-slate-100 sticky top-0 bg-white z-10">
                        <button onClick={goBack} class="w-10 h-10 flex items-center justify-center text-slate-400 hover:bg-slate-50 rounded-full"><i class="fa-solid fa-times text-lg"></i></button>
                        <h1 class="flex-grow text-center font-extrabold text-lg text-slate-900 pr-10">Check Out</h1>
                    </header>
                    <div class="px-6 py-6 flex-grow">
                        <div class="mb-6">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Remarks / Summary</label>
                            <textarea class="w-full border border-slate-200 p-4 rounded-xl h-28 focus:border-primary outline-none resize-none transition bg-slate-50" value={notes} onChange={e => setNotes(e.target.value)}></textarea>
                        </div>
                        <CameraAndLocation onCapture={(img, loc) => { setPhoto(img); setLocation(loc); }} showToast={showToast} />
                        {photo && location && (
                            <button onClick={handleFinalSubmit} class="w-full bg-slate-900 text-white py-4 rounded-xl mt-8 font-bold text-lg hover:bg-slate-800 shadow-xl transition">Complete Check-Out</button>
                        )}
                    </div>
                </div>
            );
        }

        function CameraAndLocation({ onCapture, showToast }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [stream, setStream] = useState(null);
            const [capturedImg, setCapturedImg] = useState(null);
            const [loadingGeo, setLoadingGeo] = useState(false);
            const [gpsError, setGpsError] = useState(false);

            useEffect(() => { startCamera(); return () => stopCamera(); }, []);

            const startCamera = async () => {
                try {
                    const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    setStream(mediaStream);
                    if (videoRef.current) videoRef.current.srcObject = mediaStream;
                } catch (err) { showToast("Camera access denied. Check your browser permissions.", "error"); }
            };

            const stopCamera = () => { if (stream) stream.getTracks().forEach(track => track.stop()); };

            const captureData = () => {
                if (!navigator.geolocation) {
                    showToast("Geolocation is not supported by your browser.", "error");
                    return;
                }
                setLoadingGeo(true);
                setGpsError(false);

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const canvas = canvasRef.current;
                        const video = videoRef.current;
                        canvas.width = 360; 
                        canvas.height = (video.videoHeight / video.videoWidth) * 360;
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imgData = canvas.toDataURL('image/jpeg', 0.5); 
                        
                        setCapturedImg(imgData); stopCamera(); setLoadingGeo(false);
                        onCapture(imgData, { lat: position.coords.latitude, lng: position.coords.longitude });
                    },
                    (error) => { setLoadingGeo(false); setGpsError(true); },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            };

            if (capturedImg) {
                return (
                    <div class="relative rounded-2xl overflow-hidden border-4 border-white shadow-md animate-fade-in flex items-center justify-center bg-slate-100">
                        <img src={capturedImg} class="w-full h-64 object-cover object-center" />
                        <div class="absolute bottom-0 left-0 right-0 bg-emerald-600/90 text-white p-2 text-center text-xs font-bold flex items-center justify-center gap-2">
                            <i class="fa-solid fa-location-crosshairs"></i> GPS Secured
                        </div>
                        <button onClick={() => {setCapturedImg(null); onCapture(null,null); startCamera();}} class="absolute top-3 right-3 bg-white/90 text-slate-800 p-2 rounded-full shadow hover:bg-white transition"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                );
            }

            return (
                <div class="relative rounded-2xl overflow-hidden bg-slate-900 aspect-[3/4] max-h-[380px] shadow-inner flex items-center justify-center">
                    <video ref={videoRef} autoPlay playsInline muted class="w-full h-full object-cover object-center"></video>
                    <canvas ref={canvasRef} class="hidden"></canvas>
                    
                    {loadingGeo && (
                        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center z-10 animate-fade-in">
                            <i class="fa-solid fa-location-crosshairs fa-spin text-primary text-4xl mb-4"></i>
                            <p class="text-white font-bold text-sm tracking-wide">Locking GPS...</p>
                        </div>
                    )}

                    {gpsError && (
                        <div class="absolute inset-0 bg-slate-900/90 backdrop-blur-md flex flex-col items-center justify-center z-20 animate-fade-in p-5 text-center">
                            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mb-4 shadow-lg shadow-red-500/20"><i class="fa-solid fa-location-crosshairs"></i></div>
                            <h3 class="text-white font-extrabold text-xl mb-2">Location Required</h3>
                            <p class="text-slate-300 text-sm mb-6 leading-relaxed">Please turn on your device's GPS/Location services to verify this site visit.</p>
                            <button onClick={() => { setGpsError(false); captureData(); }} class="bg-primary hover:bg-primaryHover text-white px-6 py-3.5 rounded-xl font-bold transition shadow-lg w-full mb-3">Enable GPS & Retry</button>
                            <button onClick={() => { setGpsError(false); }} class="text-slate-400 text-sm font-bold hover:text-white p-2">Cancel Capture</button>
                        </div>
                    )}

                    <div class="absolute bottom-6 left-0 right-0 flex justify-center z-0">
                        <button onClick={captureData} disabled={loadingGeo} class="bg-white text-primary w-16 h-16 rounded-full shadow-2xl border-4 border-slate-200/50 flex items-center justify-center hover:scale-105 active:scale-95 transition disabled:opacity-50"><i class="fa-solid fa-camera text-2xl"></i></button>

                dashMap[key].status = 'On-site'; 
                if (new Date(log.checkInTime) > new Date(dashMap[key].sortTime)) dashMap[key].sortTime = log.checkInTime;

            rawCompletedToday.forEach(log => {

                    (v.checkInTime || '').startsWith(filterDate)
                ).sort((a, b) => new Date(a.checkInTime) - new Date(b.checkInTime));

                const isPresent = coordVisits.length > 0;
                const firstCheckIn = isPresent ? new Date(coordVisits[0].checkInTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}) : '-';
                
                const lastCheckOut = isPresent && coordVisits[coordVisits.length - 1].checkOutTime 
                    ? new Date(coordVisits[coordVisits.length - 1].checkOutTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}) 
                    : (isPresent && !coordVisits[coordVisits.length - 1].checkOutTime ? 'Still On-site' : '-');
                
                const sitesVisited = isPresent ? [...new Set(coordVisits.map(v => v.siteName))].join(', ') : '-';

                return { ...coord, isPresent, firstCheckIn, lastCheckOut, sitesVisited, visitCount: coordVisits.length };

        function LogsView({ db, showToast }) {
            const [filterCoordId, setFilterCoordId] = useState('');
            const [filterDate, setFilterDate] = useState('');
            const [selectedGroup, setSelectedGroup] = useState(null);

            const coordinators = db.users.filter(u => u.role === 'coordinator');

            const rawFiltered = allLogs.filter(log => {
                const matchCoord = filterCoordId ? String(log.coordinatorId) === String(filterCoordId) : true;
                const logDate = log.checkInTime ? new Date(log.checkInTime).toISOString().split('T')[0] : '';
                const matchDate = filterDate ? logDate === filterDate : true;
                return matchCoord && matchDate;
            });

            const groupedMap = {};
            rawFiltered.forEach(log => {
                const key = `${log.siteName}::${log.coordinatorId}`;
                if (!groupedMap[key]) {
                    groupedMap[key] = { siteName: log.siteName, coordinatorName: log.coordinatorName, latestTime: log.checkInTime, visits: [] };
                }
                groupedMap[key].visits.push(log);
                if (new Date(log.checkInTime) > new Date(groupedMap[key].latestTime)) groupedMap[key].latestTime = log.checkInTime;
            });
            const groupedLogs = Object.values(groupedMap).sort((a,b) => new Date(b.latestTime) - new Date(a.latestTime));

            // EXECUTIVE MULTI-PAGE TABULAR PDF REPORT WITH PHOTO THUMBNAILS & VISIT STATS
            const downloadBulkPDF = (mode) => {
                showToast("Generating comprehensive PDF report...", "success");
                
                const dataToExport = mode === 'overall'

                const siteVisitCounts = {};

                    const sName = (item.siteName || 'Unknown').trim();
                    siteVisitCounts[sName] = (siteVisitCounts[sName] || 0) + 1;

                const cName = filterCoordId ? coordinators.find(c => String(c.id) === String(filterCoordId))?.name : 'All Coordinators';
                const dName = filterDate ? filterDate : 'All Time';
                const filename = mode === 'overall' ? 'SiteTrack_Comprehensive_Report.pdf' : `SiteTrack_Report_${cName.replace(/\s+/g,'_')}_${dName}.pdf`;

                // 2. Generate clean, properly aligned table rows
                let tableRowsHtml = dataToExport.map((v, i) => {

                    const outMapUrl = v.checkOutLocation?.lat ? `https://maps.google.com/?q=${v.checkOutLocation.lat},${v.checkOutLocation.lng}` : null;
                    const totalVisitsForThisSite = siteVisitCounts[(v.siteName || '').trim()] || 1;

                                <div style="font-size: 10px; color: #1e293b; background: #f1f5f9; display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 600;">Total Visits: ${totalVisitsForThisSite}</div>

                                <div style="font-weight: 700; color: #0f172a; font-size: 11px;">${v.coordinatorName}</div>

                                ${inMapUrl ? `

                                ${outMapUrl ? `
                                    <a href="${outMapUrl}" target="_blank" style="background: #e0f2fe; color: #0284c7; text-decoration: none; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; border: 1px solid #bae6fd;">🗺️ View Map</a>
                                ` : `<div style="font-size: 10px; color: #94a3b8; padding: 4px 0;">${v.checkOutTime ? 'No GPS' : '--'}</div>`}
                            </td>

                            <td style="padding: 12px 8px; font-size: 11px; color: #334155; vertical-align: top; line-height: 1.5; word-wrap: break-word;">
                                ${v.notes ? v.notes : '<span style="color: #94a3b8; font-style: italic;">No remarks added.</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');

                // 3. Overall Top KPI Calculation
                const uniqueSitesSet = new Set(dataToExport.map(v => v.siteName));
                const totalWorkersSum = dataToExport.reduce((acc, curr) => acc + (parseInt(curr.workers) || 0), 0);

                // 4. Build Full Standalone HTML with Rigid Landscape Dimensions (No device scale clipping)
                const fullReportHtml = `
                    <div style="width: 1060px; background-color: #ffffff; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; box-sizing: border-box; color: #0f172a;">
                        
                        <!-- Header Banner -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #4f46e5; padding-bottom: 14px; margin-bottom: 18px; break-inside: avoid;">
                            <div>
                                <h1 style="font-size: 24px; font-weight: 900; color: #1e1b4b; margin: 0 0 4px 0; letter-spacing: -0.5px;">SITE TRACK | FIELD OPERATIONS REPORT</h1>
                                <p style="font-size: 11px; color: #64748b; margin: 0;">Comprehensive verification log including timestamps, identity selfies, and geo-locations</p>
                            </div>
                            <div style="text-align: right; font-size: 11px; color: #64748b; line-height: 1.5;">
                                <div><strong>Coordinator:</strong> <span style="color: #1e293b;">${cName}</span></div>
                                <div><strong>Date Scope:</strong> <span style="color: #1e293b;">${dName}</span></div>
                                <div><strong>Generated:</strong> ${new Date().toLocaleString()}</div>
                            </div>
                        </div>

                        <!-- Top KPI Stats Cards -->
                        <div style="display: flex; gap: 12px; margin-bottom: 20px; break-inside: avoid;">
                            <div style="flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px;">
                                <div style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Total Visits in Report</div>
                                <div style="font-size: 20px; font-weight: 900; color: #4f46e5; margin-top: 2px;">${dataToExport.length}</div>
                            </div>
                            <div style="flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px;">
                                <div style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Distinct Projects</div>
                                <div style="font-size: 20px; font-weight: 900; color: #0284c7; margin-top: 2px;">${uniqueSitesSet.size}</div>
                            </div>
                            <div style="flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px;">
                                <div style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Total Workers Present</div>
                                <div style="font-size: 20px; font-weight: 900; color: #d97706; margin-top: 2px;">${totalWorkersSum}</div>
                            </div>
                        </div>

                        <!-- Records Table -->
                        <table style="width: 100%; text-align: left; border-collapse: collapse; table-layout: fixed; font-size: 11px;">
                            <thead>
                                <tr style="background-color: #f8fafc; color: #0f172a; border-top: 2px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; break-inside: avoid; page-break-inside: avoid;">
                                    <th style="padding: 12px 8px; width: 4%; font-weight: 800; text-transform: uppercase; text-align: center;">#</th>
                                    <th style="padding: 12px 8px; width: 12%; font-weight: 800; text-transform: uppercase;">Date & Time</th>
                                    <th style="padding: 12px 8px; width: 22%; font-weight: 800; text-transform: uppercase;">Site Details</th>
                                    <th style="padding: 12px 8px; width: 14%; font-weight: 800; text-transform: uppercase;">Coordinator</th>
                                    <th style="padding: 12px 8px; width: 13%; text-align: center; font-weight: 800; text-transform: uppercase;">Login</th>
                                    <th style="padding: 12px 8px; width: 13%; text-align: center; font-weight: 800; text-transform: uppercase;">Logout</th>
                                    <th style="padding: 12px 8px; width: 22%; font-weight: 800; text-transform: uppercase;">Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRowsHtml || '<tr><td colspan="7" style="padding: 30px; text-align: center; color: #94a3b8; font-style: italic;">No records found matching filters.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;

                // 5. Render directly through html2pdf with row-split guards
                html2pdf().set({
                    margin: [8, 8, 8, 8],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                    pagebreak: { mode: ['css', 'legacy'], avoid: 'tr' }
                }).from(fullReportHtml).save().then(() => {
                    showToast("PDF report generated successfully!", "success");
                }).catch(err => {
                    console.error("PDF error:", err);
                    showToast("Error generating PDF.", "error");
                });
            };

            return (
                <div class="max-w-6xl mx-auto animate-fade-in relative">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8">
                        <div class="mb-4 border-b border-slate-100 pb-4 flex items-center justify-between">
                            <h2 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-file-pdf text-red-500 text-xl"></i> Export PDF Reports
                            </h2>
                            {db.isSyncing && <span class="text-xs font-bold text-primary bg-indigo-50 px-2 py-1 rounded-md"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Syncing</span>}
                        </div>
                        
                        <div class="flex flex-col md:flex-row gap-4 items-end">
                            <div class="w-full md:w-1/3">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Select Coordinator</label>
                                <select class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-700 focus:border-primary outline-none bg-slate-50 font-semibold" value={filterCoordId} onChange={e => setFilterCoordId(e.target.value)}>
                                    <option value="">All Coordinators</option>
                                    {coordinators.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>
                            <div class="w-full md:w-1/4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Select Date</label>
                                <input type="date" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-700 focus:border-primary outline-none bg-slate-50 font-semibold" value={filterDate} onChange={e => setFilterDate(e.target.value)} />
                            </div>
                            <div class="w-full md:flex-1 flex gap-3">
                                <button onClick={() => downloadBulkPDF('filtered')} class="flex-1 bg-indigo-50 text-primary border border-indigo-100 py-3 rounded-xl font-bold hover:bg-indigo-100 transition shadow-sm">
                                    Download Selected
                                </button>
                                <button onClick={() => downloadBulkPDF('overall')} class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition shadow-md">
                                    Download All
                                </button>
                            </div>
                        </div>
                    </div>

                    <h2 class="text-lg font-extrabold text-slate-900 mb-4 pl-1">Historical Grouped Views</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50 text-slate-400 text-xs font-bold uppercase border-b border-slate-100">
                                <tr>
                                    <th class="p-4 pl-6">Last Visited Date</th>
                                    <th class="p-4">Site Visited</th>
                                    <th class="p-4">Coordinator</th>
                                    <th class="p-4 text-center">Total Visits</th>
                                    <th class="p-4 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {groupedLogs.length === 0 && <tr><td colSpan="5" class="p-8 text-center text-slate-400 text-sm">No records found matching filters.</td></tr>}
                                {groupedLogs.map((group, idx) => (
                                    <tr key={idx} class="border-b border-slate-50 hover:bg-slate-50/50 transition">
                                        <td class="p-4 pl-6 font-bold text-slate-800 text-sm">{new Date(group.latestTime).toLocaleDateString()}</td>
                                        <td class="p-4 font-bold text-slate-800 text-sm">{group.siteName}</td>
                                        <td class="p-4 font-bold text-sm text-slate-800">{group.coordinatorName}</td>
                                        <td class="p-4 text-center text-sm font-black text-primary bg-indigo-50/30">{group.visits.length}</td>
                                        <td class="p-4 text-center"><button onClick={() => setSelectedGroup(group)} class="text-primary font-bold text-xs bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">View History</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {selectedGroup && <LogDetailsModal group={selectedGroup} onClose={() => setSelectedGroup(null)} />}
                </div>
            );
        }

        function LogDetailsModal({ group, onClose }) {
            const sortedVisits = [...group.visits].sort((a,b) => new Date(a.checkInTime) - new Date(b.checkInTime));

            return (
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50 animate-fade-in">
                    <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[95vh] flex flex-col shadow-2xl overflow-hidden relative">
                        
                        <div class="flex justify-between items-center p-4 sm:p-5 border-b border-slate-100 bg-slate-50 sticky top-0 z-10">
                            <button onClick={onClose} class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-xl shadow-sm hover:bg-slate-100 transition active:scale-95 font-bold">
                                <i class="fa-solid fa-arrow-left"></i> Back
                            </button>
                        </div>
                        
                        <div class="p-6 overflow-y-auto">
                            <h2 class="text-3xl font-black mb-1 text-slate-900">{group.siteName}</h2>
                            <p class="text-slate-500 text-sm mb-6 pb-4 border-b border-slate-100">
                                Coordinator: <span class="font-bold text-slate-800">{group.coordinatorName}</span> &nbsp;|&nbsp; 
                                Total Visits: <span class="font-bold text-slate-800">{group.visits.length}</span>
                            </p>
                            
                            <div class="space-y-8">
                                {sortedVisits.map((log, index) => (
                                    <div key={log.id} class="break-inside-avoid">
                                        <div class="flex items-center gap-3 mb-4">
                                            <div class="bg-primary text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs">{index + 1}</div>
                                            <h4 class="font-extrabold text-slate-800">Visit on {new Date(log.checkInTime).toLocaleDateString()}</h4>
                                        </div>
                                        
                                        <div class="grid sm:grid-cols-2 gap-6 ml-9">
                                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <h4 class="font-bold text-slate-800 mb-2 border-b border-slate-200 pb-2 text-sm uppercase">Check-In</h4>
                                                <p class="text-sm font-medium mb-3 text-slate-600">{new Date(log.checkInTime).toLocaleString('en-US')}</p>
                                                <div class="mb-3">
                                                    <a href={log.checkInPhoto} target="_blank" class="text-primary font-bold text-sm underline"><i class="fa-solid fa-image mr-1"></i> log in image</a>
                                                </div>
                                                <p class="text-xs text-slate-500 font-medium mb-2"><i class="fa-solid fa-users mr-1"></i> Workers: {log.workers}</p>
                                                <div>
                                                    <a href={`https://maps.google.com/?q=${log.checkInLocation?.lat},${log.checkInLocation?.lng}`} target="_blank" class="text-primary font-bold text-sm underline"><i class="fa-solid fa-location-dot mr-1"></i> log in location</a>
                                                </div>
                                            </div>
                                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <h4 class="font-bold text-slate-800 mb-2 border-b border-slate-200 pb-2 text-sm uppercase">Check-Out</h4>
                                                {log.checkOutTime ? (
                                                    <>
                                                        <p class="text-sm font-medium mb-3 text-slate-600">{new Date(log.checkOutTime).toLocaleString('en-US')}</p>
                                                        <div class="mb-3">
                                                            <a href={log.checkOutPhoto} target="_blank" class="text-primary font-bold text-sm underline"><i class="fa-solid fa-image mr-1"></i> log out image</a>
                                                        </div>
                                                        <p class="text-xs text-slate-800 font-medium mb-2 truncate"><i class="fa-solid fa-comment-dots mr-1 text-slate-400"></i> {log.notes || 'No remarks'}</p>
                                                        <div>
                                                            <a href={`https://maps.google.com/?q=${log.checkOutLocation?.lat},${log.checkOutLocation?.lng}`} target="_blank" class="text-primary font-bold text-sm underline"><i class="fa-solid fa-location-dot mr-1"></i> log out location</a>
                                                        </div>
                                                    </>
                                                ) : (
                                                    <div class="flex flex-col items-center justify-center h-full min-h-[12rem] text-slate-400">
                                                        <i class="fa-solid fa-clock-rotate-left text-3xl mb-2"></i>
                                                        <p class="text-sm font-medium italic">User is still on-site</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        {index < sortedVisits.length - 1 && <hr class="mt-8 border-slate-200" />}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function UserManagementView({ db, showToast }) {
            const [newUser, setNewUser] = useState({ name: '', email: '', password: '', role: 'coordinator' });
            const [userToDelete, setUserToDelete] = useState(null); 

            const handleAddUser = (e) => {
                e.preventDefault();
                const cleanEmail = newUser.email.trim().toLowerCase();
                if (db.users.find(u => u.email.toLowerCase() === cleanEmail)) return showToast("Email already exists!", "error");
                const userObj = { ...newUser, email: cleanEmail, id: Date.now().toString() };
                db.setUsers(prev => [...prev, userObj]);
                db.pushToGoogleSheet("addUser", { data: userObj });
                setNewUser({ name: '', email: '', password: '', role: 'coordinator' });
                showToast("User created successfully!", "success");
            };

            const confirmRemove = () => {
                db.setUsers(prev => prev.filter(u => u.id !== userToDelete));
                db.pushToGoogleSheet("removeUser", { id: userToDelete });
                setUserToDelete(null);
                showToast("User removed.", "success");
            };

            return (
                <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in relative">
                    {userToDelete && (
                        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                                <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4 text-xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                                <h3 class="text-xl font-extrabold text-slate-900 mb-2">Remove User?</h3>
                                <p class="text-sm text-slate-500 mb-6">Are you sure you want to permanently delete this user's access? This cannot be undone.</p>
                                <div class="flex gap-3">
                                    <button onClick={() => setUserToDelete(null)} class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-200 transition">Cancel</button>
                                    <button onClick={confirmRemove} class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-lg shadow-red-600/30">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                        <h3 class="font-extrabold text-lg mb-4 text-slate-900 border-b border-slate-100 pb-2">Create User</h3>
                        <form onSubmit={handleAddUser} class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
                                <input required type="text" class="w-full border border-slate-200 p-2.5 rounded-lg focus:border-primary outline-none text-sm" value={newUser.name} onChange={e=>setNewUser({...newUser, name: e.target.value})} />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
                                <input required type="email" class="w-full border border-slate-200 p-2.5 rounded-lg focus:border-primary outline-none text-sm" value={newUser.email} onChange={e=>setNewUser({...newUser, email: e.target.value})} />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
                                <input required type="text" class="w-full border border-slate-200 p-2.5 rounded-lg focus:border-primary outline-none text-sm" value={newUser.password} onChange={e=>setNewUser({...newUser, password: e.target.value})} />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Role</label>
                                <select class="w-full border border-slate-200 p-2.5 rounded-lg focus:border-primary outline-none text-sm bg-white" value={newUser.role} onChange={e=>setNewUser({...newUser, role: e.target.value})}>
                                    <option value="coordinator">Coordinator</option><option value="admin">Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-primaryHover shadow mt-2 transition">Add User</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50 text-slate-400 text-xs font-bold uppercase border-b border-slate-100">
                                <tr>
                                    <th class="p-4 pl-6">User</th>
                                    <th class="p-4 text-center">Role</th>
                                    <th class="p-4 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {db.users.map(user => (
                                    <tr key={user.id} class="border-b border-slate-50 hover:bg-slate-50/50">
                                        <td class="p-4 pl-6">
                                            <p class="font-bold text-slate-800 text-sm">{user.name}</p>
                                            <p class="text-xs text-slate-500 font-medium">{user.email}</p>
                                        </td>
                                        <td class="p-4 text-center">
                                            <span class={`px-2.5 py-1 rounded-md text-xs font-bold ${user.role === 'admin' ? 'bg-indigo-50 text-primary border border-indigo-100' : 'bg-slate-100 text-slate-600 border border-slate-200'}`}>
                                                {user.role.toUpperCase()}
                                            </span>
                                        </td>
                                        <td class="p-4 text-center">
                                            {user.id !== '1' ? (
                                                <button onClick={() => setUserToDelete(user.id)} class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                                            ) : (
                                                <button onClick={() => showToast("Cannot delete the primary admin.", "error")} class="text-slate-300 cursor-not-allowed p-2"><i class="fa-solid fa-trash"></i></button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
